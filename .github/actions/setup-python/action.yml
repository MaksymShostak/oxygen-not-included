{
  "name": "Set up repository Python",
  "description": "Provision the Python version selected by .python-version",
  "runs": {
    "using": "composite",
    "steps": [
      {
        "uses": "actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0",
        "with": {
          "python-version-file": ".python-version"
        }
      }
    ]
  }
}
