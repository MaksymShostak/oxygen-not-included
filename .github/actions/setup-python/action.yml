{
  "name": "Set up repository Python",
  "description": "Provision repository-selected Python with the shared pinned uv toolchain",
  "runs": {
    "using": "composite",
    "steps": [
      {
        "uses": "astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884",
        "with": {
          "version": "0.13.7",
          "activate-environment": true,
          "venv-path": "${{ runner.temp }}/python",
          "no-project": true,
          "enable-cache": false
        }
      }
    ]
  }
}
