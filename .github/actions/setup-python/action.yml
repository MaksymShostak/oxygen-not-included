{
  "name": "Set up repository Python",
  "description": "Provision repository-selected Python with the shared pinned uv toolchain",
  "runs": {
    "using": "composite",
    "steps": [
      {
        "uses": "astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2",
        "with": {
          "version": "0.13.7",
          "activate-environment": true,
          "venv-path": "${{ runner.temp }}/python",
          "no-project": true,
          "enable-cache": false
        }
      }
    ]
  }
}
