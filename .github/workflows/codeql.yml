{
  "name": "CodeQL",
  "on": {
    "workflow_call": {
      "inputs": {
        "plan": {
          "required": true,
          "type": "string"
        }
      },
      "outputs": {
        "completion_sha": {
          "value": "${{ jobs.complete.outputs.completion_sha }}"
        }
      }
    }
  },
  "permissions": {},
  "jobs": {
    "validate": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 5,
      "permissions": {
        "contents": "read"
      },
      "outputs": {
        "languages": "${{ steps.scope.outputs.languages }}"
      },
      "env": {
        "ONI_PLAN": "${{ inputs.plan }}"
      },
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "fetch-depth": 0,
            "persist-credentials": false
          }
        },
        {
          "id": "scope",
          "name": "Independently validate selection and analysis trust",
          "run": "python3 -c \"import sys; assert sys.version_info >= (3,10); print(sys.version)\"\npython3 tools/ci/checks.py validate\npython3 -c 'import json,os; p=json.loads(os.environ[\"ONI_PLAN\"]); assert p[\"checks\"][\"codeql\"] and p[\"eligibility\"][\"codeql\"] and p[\"languages\"]'\n"
        }
      ]
    },
    "analyze-actions": {
      "needs": "validate",
      "if": "contains(fromJSON(needs.validate.outputs.languages), 'actions')",
      "name": "Analyze (actions)",
      "uses": "./.github/workflows/codeql-language.yml",
      "permissions": {
        "contents": "read",
        "security-events": "write"
      },
      "with": {
        "plan": "${{ inputs.plan }}",
        "language": "actions"
      }
    },
    "analyze-csharp": {
      "needs": "validate",
      "if": "contains(fromJSON(needs.validate.outputs.languages), 'csharp')",
      "name": "Analyze (csharp)",
      "uses": "./.github/workflows/codeql-language.yml",
      "permissions": {
        "contents": "read",
        "security-events": "write"
      },
      "with": {
        "plan": "${{ inputs.plan }}",
        "language": "csharp"
      }
    },
    "analyze-python": {
      "needs": "validate",
      "if": "contains(fromJSON(needs.validate.outputs.languages), 'python')",
      "name": "Analyze (python)",
      "uses": "./.github/workflows/codeql-language.yml",
      "permissions": {
        "contents": "read",
        "security-events": "write"
      },
      "with": {
        "plan": "${{ inputs.plan }}",
        "language": "python"
      }
    },
    "complete": {
      "if": "always()",
      "needs": [
        "validate",
        "analyze-actions",
        "analyze-csharp",
        "analyze-python"
      ],
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 5,
      "permissions": {
        "contents": "read"
      },
      "outputs": {
        "completion_sha": "${{ steps.complete.outputs.completion_sha }}"
      },
      "env": {
        "ONI_PLAN": "${{ inputs.plan }}",
        "ONI_VALIDATION_RESULT": "${{ needs.validate.result }}",
        "ONI_ACTIONS_RESULT": "${{ needs.analyze-actions.result }}",
        "ONI_ACTIONS_RECEIPT": "${{ needs.analyze-actions.outputs.receipt }}",
        "ONI_CSHARP_RESULT": "${{ needs.analyze-csharp.result }}",
        "ONI_CSHARP_RECEIPT": "${{ needs.analyze-csharp.outputs.receipt }}",
        "ONI_PYTHON_RESULT": "${{ needs.analyze-python.result }}",
        "ONI_PYTHON_RECEIPT": "${{ needs.analyze-python.outputs.receipt }}"
      },
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "fetch-depth": 0,
            "persist-credentials": false
          }
        },
        {
          "id": "complete",
          "name": "Verify every selected language and return tested identity",
          "run": "python3 tools/ci/checks.py codeql-complete"
        }
      ]
    }
  }
}
