name: CodeQL

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string
    outputs:
      completion_sha:
        value: ${{ jobs.complete.outputs.completion_sha }}

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      languages: ${{ steps.scope.outputs.languages }}
    env:
      ONI_PLAN: ${{ inputs.plan }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        name: Independently validate selection and analysis trust
        run: |
          python3 -c "import sys; assert sys.version_info >= (3,10); print(sys.version)"
          python3 tools/ci/checks.py validate
          python3 -c 'import json,os; p=json.loads(os.environ["ONI_PLAN"]); assert p["checks"]["codeql"] and p["eligibility"]["codeql"] and p["languages"]'

  analyze:
    needs: validate
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.validate.outputs.languages) }}
    env:
      ONI_PLAN: ${{ inputs.plan }}
      ONI_LANGUAGE: ${{ matrix.language }}
    steps:
      - name: Check out the source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate actual tested revision
        run: python3 tools/ci/checks.py validate
      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          tools: linked
      - id: analysis
        name: Analyze and upload results
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:${{ matrix.language }}"
      - name: Record selected-language completion
        env:
          ONI_RECEIPTS: ${{ runner.temp }}/oni-codeql-receipt
          ONI_ANALYSIS_RESULT: ${{ steps.analysis.outcome }}
        run: python3 tools/ci/checks.py codeql-receipt
      - name: Retain same-attempt completion data
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oni-codeql-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.language }}
          path: ${{ runner.temp }}/oni-codeql-receipt/*.json
          if-no-files-found: error
          retention-days: 1

  complete:
    if: always()
    needs: [validate, analyze]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      completion_sha: ${{ steps.complete.outputs.completion_sha }}
    env:
      ONI_PLAN: ${{ inputs.plan }}
      ONI_ANALYSIS_RESULT: ${{ needs.analyze.result }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require the validated matrix
        env:
          VALIDATION_RESULT: ${{ needs.validate.result }}
        run: python3 -c 'import os; assert os.environ["VALIDATION_RESULT"] == "success"'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: oni-codeql-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: ${{ runner.temp }}/oni-codeql-completions
          merge-multiple: true
      - id: complete
        name: Verify every selected language and return tested identity
        env:
          ONI_RECEIPTS: ${{ runner.temp }}/oni-codeql-completions
        run: python3 tools/ci/checks.py codeql-complete
