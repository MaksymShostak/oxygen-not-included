name: ONI checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "52 16 * * 0"
permissions:
  contents: read
concurrency:
  group: oni-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}-{1}', github.run_id, github.run_attempt) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  select:
    name: Select applicable checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      plan: ${{ steps.scope.outputs.plan }}
      worker: ${{ steps.scope.outputs.worker }}
      documentation: ${{ steps.scope.outputs.documentation }}
      codeql: ${{ steps.scope.outputs.codeql }}
      dependency: ${{ steps.scope.outputs.dependency }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-python
      - name: Record supported control runtime
        run: python3 --version
      - name: Check centralized action pins
        run: python3 tools/ci/action_versions.py --check
      - id: scope
        run: python3 tools/ci/checks.py select
      - name: Test CI contracts when their controls changed
        if: fromJSON(steps.scope.outputs.plan).checks.pipeline && fromJSON(steps.scope.outputs.plan).checks.python
        run: python3 -m unittest discover -s tests -p 'test_ci_*.py'

  worker:
    needs: [select, documentation]
    if: ${{ !cancelled() && needs.select.result == 'success' && needs.select.outputs.worker == 'true' && (needs.documentation.result == 'success' || (needs.select.outputs.documentation != 'true' && needs.documentation.result == 'skipped')) }}
    name: Selected application checks
    runs-on: windows-latest
    timeout-minutes: 15
    outputs:
      completion_sha: ${{ steps.complete.outputs.completion_sha }}
    env:
      ONI_PLAN: ${{ needs.select.outputs.plan }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-python
      - name: Verify selection against this checkout
        run: |
          python tools/ci/checks.py validate
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        if: fromJSON(env.ONI_PLAN).checks.pipeline || fromJSON(env.ONI_PLAN).checks.producer
        with:
          global-json-file: global.json
      - name: Restore locked pipeline dependencies
        if: fromJSON(env.ONI_PLAN).checks.pipeline || fromJSON(env.ONI_PLAN).checks.producer
        run: dotnet restore tools/oni-mod-pipeline/OniModPipeline.slnx --locked-mode
      - id: pipeline
        name: Test the pipeline without game installation
        if: fromJSON(env.ONI_PLAN).checks.pipeline
        run: dotnet test --project tools/oni-mod-pipeline/tests/OniModPipeline.Tests/OniModPipeline.Tests.csproj --no-restore -- --report-trx --coverage --coverage-output-format cobertura --results-directory artifacts/tests/pipeline
      - id: python
        name: Test repository Python scripts
        if: fromJSON(env.ONI_PLAN).checks.python
        run: python -m unittest discover -s tests -p "test_*.py"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: fromJSON(env.ONI_PLAN).checks.producer
        with:
          node-version-file: .node-version
      - name: Acquire public locked producer tooling without lifecycle scripts
        if: fromJSON(env.ONI_PLAN).checks.producer
        run: |
          node --version
          $npmSelection = node -p "require('./package.json').packageManager"
          $npmPrefix = node -p "require('node:path').dirname(process.execPath)"
          npm install --global --prefix $npmPrefix $npmSelection --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ("npm@$(npm --version)" -ne $npmSelection) { throw "npm does not match packageManager" }
          npm ci --ignore-scripts --no-audit --no-fund --registry https://registry.npmjs.org/
      - id: producer
        name: Check real README producer convergence without game installation
        if: fromJSON(env.ONI_PLAN).checks.producer
        run: npm run pipeline -- sync-readme --mod mods/delivery-temperature-limit-supercooled --check
      - id: complete
        name: Require successful selected steps and return tested identity
        env:
          ONI_CONSUMER: worker
          ONI_STEPS: '{"pipeline":"${{ steps.pipeline.outcome }}","python":"${{ steps.python.outcome }}","producer":"${{ steps.producer.outcome }}"}'
        run: python tools/ci/checks.py complete

  documentation:
    needs: select
    if: needs.select.outputs.documentation == 'true'
    name: Markdown and README integration
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      completion_sha: ${{ steps.complete.outputs.completion_sha }}
    env:
      ONI_PLAN: ${{ needs.select.outputs.plan }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-python
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Install the locked root development graph without lifecycle scripts
        run: |
          npm install --global --prefix "$(dirname "$(dirname "$(command -v node)")")" "$(node -p "require('./package.json').packageManager")" --ignore-scripts --no-audit --no-fund
          test "npm@$(npm --version)" = "$(node -p "require('./package.json').packageManager")"
          npm ci --include=dev --ignore-scripts --no-audit --no-fund
      - name: Check all authored Markdown before consumer tests
        run: |
          token="$(node -e "process.stdout.write(require('node:crypto').randomBytes(32).toString('hex'))")"
          trap 'status=$?; printf "\n::%s::\n" "$token"; exit "$status"' EXIT
          printf '::stop-commands::%s\n' "$token"
          npm run --silent check:markdown 2>&1
      - name: Verify public consumer contracts and independent character policy
        run: |
          npm run test:readme
          python3 tools/ci/check_doc_characters.py .
          python3 tools/ci/checks.py validate
      - id: complete
        env:
          ONI_CONSUMER: documentation
        run: python3 tools/ci/checks.py complete

  codeql:
    needs: select
    if: needs.select.outputs.codeql == 'true'
    uses: ./.github/workflows/codeql.yml
    permissions:
      contents: read
      security-events: write
    with:
      plan: ${{ needs.select.outputs.plan }}

  dependency:
    needs: select
    if: needs.select.outputs.dependency == 'true'
    uses: ./.github/workflows/dependency-submission.yml
    permissions:
      contents: write
    with:
      plan: ${{ needs.select.outputs.plan }}

  required:
    name: Required ONI checks
    if: always()
    needs: [select, worker, documentation, codeql, dependency]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      ONI_PLAN: ${{ needs.select.outputs.plan }}
      ONI_RESULTS: '{"worker":"${{ needs.worker.result }}","documentation":"${{ needs.documentation.result }}","codeql":"${{ needs.codeql.result }}","dependency":"${{ needs.dependency.result }}"}'
      ONI_COMPLETIONS: '{"worker":"${{ needs.worker.outputs.completion_sha }}","documentation":"${{ needs.documentation.outputs.completion_sha }}","codeql":"${{ needs.codeql.outputs.completion_sha }}","dependency":"${{ needs.dependency.outputs.completion_sha }}"}'
    steps:
      - name: Require a successful selection
        env:
          SELECTION_RESULT: ${{ needs.select.result }}
        run: test "$SELECTION_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-python
      - name: Independently evaluate selected completion and identities
        run: python3 tools/ci/checks.py gate
