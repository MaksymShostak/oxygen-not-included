name: Steam Community BBCode checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  converter:
    name: BBCode / ${{ matrix.os }} / Node ${{ matrix.node }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22.23.2, 24.20.0, 26.8.1]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
      - name: Select affected converter checks
        id: scope
        run: node scripts/selectPullRequestChecks.js --scope converter
      - name: Install locked converter development dependencies
        if: steps.scope.outputs.converter == 'true'
        run: npm exec --yes --package=npm@12.0.2 -- npm --prefix tools/steam-community-bbcode ci --ignore-scripts
      - name: Install the approved isolated type-coverage tool
        if: steps.scope.outputs.converter == 'true'
        run: npm exec --yes --package=npm@12.0.2 -- npm --prefix tools/steam-community-bbcode/tooling/type-coverage ci --ignore-scripts
      - name: Generate locked dependency inventories
        if: steps.scope.outputs.converter == 'true'
        working-directory: tools/steam-community-bbcode
        run: |
          node --input-type=module -e "import {mkdirSync} from 'node:fs'; mkdirSync('artifacts/supply-chain', {recursive: true});"
          npm exec --yes --package=npm@12.0.2 -- npm run --silent sbom > artifacts/supply-chain/package.cdx.json
          npm exec --yes --package=npm@12.0.2 -- npm run --silent sbom:type-coverage > artifacts/supply-chain/type-coverage.cdx.json
      - name: Check the converter and real packed consumer
        if: steps.scope.outputs.converter == 'true'
        run: npm exec --yes --package=npm@12.0.2 -- npm run check:converter
      - name: Qualify library and CLI mutation sensitivity
        if: steps.scope.outputs.converter == 'true' && matrix.os == 'ubuntu-latest' && matrix.node == '24.20.0'
        run: npm exec --yes --package=npm@12.0.2 -- npm --prefix tools/steam-community-bbcode run test:mutation
      - name: Retain qualification reports
        if: always() && steps.scope.outputs.converter == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bbcode-${{ matrix.os }}-node-${{ matrix.node }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            tools/steam-community-bbcode/artifacts/runtime-coverage/
            tools/steam-community-bbcode/artifacts/mutation-library/
            tools/steam-community-bbcode/artifacts/mutation-cli/
            tools/steam-community-bbcode/artifacts/supply-chain/
  dependency-review:
    name: BBCode / Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.20.0
      - name: Select affected converter checks
        id: scope
        run: node scripts/selectPullRequestChecks.js --scope converter
      - name: Review introduced dependencies
        if: steps.scope.outputs.converter == 'true'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: low
          fail-on-scopes: runtime, development, unknown
          comment-summary-in-pr: never
