{
  "name": "CodeQL language analysis",
  "on": {
    "workflow_call": {
      "inputs": {
        "plan": {
          "required": true,
          "type": "string"
        },
        "language": {
          "required": true,
          "type": "string"
        }
      },
      "outputs": {
        "receipt": {
          "value": "${{ jobs.analyze.outputs.receipt }}"
        }
      }
    }
  },
  "permissions": {},
  "jobs": {
    "analyze": {
      "name": "Analyze selected language",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 20,
      "permissions": {
        "contents": "read",
        "security-events": "write"
      },
      "outputs": {
        "receipt": "${{ steps.receipt.outputs.receipt }}"
      },
      "env": {
        "ONI_PLAN": "${{ inputs.plan }}",
        "ONI_LANGUAGE": "${{ inputs.language }}"
      },
      "steps": [
        {
          "name": "Check out the source revision",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "fetch-depth": 0,
            "persist-credentials": false
          }
        },
        {
          "name": "Validate tested revision, selected language and analysis trust",
          "run": "python3 tools/ci/checks.py validate\npython3 -c 'import json,os; plan=json.loads(os.environ[\"ONI_PLAN\"]); language=os.environ[\"ONI_LANGUAGE\"]; assert language in (\"actions\",\"csharp\",\"python\") and language in plan[\"languages\"] and plan[\"checks\"][\"codeql\"] and plan[\"eligibility\"][\"codeql\"]'\n"
        },
        {
          "name": "Initialize CodeQL",
          "uses": "github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd",
          "with": {
            "languages": "${{ inputs.language }}",
            "build-mode": "none",
            "tools": "linked"
          }
        },
        {
          "id": "analysis",
          "name": "Analyze and upload results",
          "uses": "github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd",
          "with": {
            "category": "/language:${{ inputs.language }}"
          }
        },
        {
          "id": "receipt",
          "name": "Return successful selected-language completion",
          "env": {
            "ONI_ANALYSIS_RESULT": "${{ steps.analysis.outcome }}"
          },
          "run": "python3 tools/ci/checks.py codeql-receipt"
        }
      ]
    }
  }
}
