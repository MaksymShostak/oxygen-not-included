name: Steam Community BBCode renderer conformance
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  renderer:
    name: BBCode / GitHub renderer
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.20.0
      - name: Install locked converter runtime dependencies
        run: npm exec --yes --package=npm@12.0.2 -- npm --prefix tools/steam-community-bbcode ci --omit=dev --ignore-scripts
      - name: Verify selected GitHub rendering contracts
        working-directory: tools/steam-community-bbcode
        run: npm exec --yes --package=npm@12.0.2 -- npm run qualify:github
      - name: Retain renderer observations
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bbcode-github-renderer
          path: tools/steam-community-bbcode/artifacts/github-rendering/
          retention-days: 30
          if-no-files-found: warn
