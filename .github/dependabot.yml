# Native update proposals; latest-first selection does not mean automatic approval.
version: 2
multi-ecosystem-groups:
  repository-version-updates:
    schedule:
      interval: daily
updates:
  - package-ecosystem: npm
    directories:
      - /
      - /tools/steam-community-bbcode
      - /tools/steam-community-bbcode/tooling/type-coverage
      - /tools/steam-community-bbcode/tooling/api-docs
    patterns: ["*"]
    multi-ecosystem-group: repository-version-updates
    cooldown:
      default-days: 0
  - package-ecosystem: pip
    directories:
      - /
      - /tools/steam-community-bbcode/tooling/prose
    patterns: ["*"]
    multi-ecosystem-group: repository-version-updates
    cooldown:
      default-days: 0
  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: repository-version-updates
    cooldown:
      default-days: 0
  - package-ecosystem: nuget
    directories:
      - /tools/oni-mod-pipeline
      - /mods/delivery-temperature-limit-supercooled
    patterns: ["*"]
    multi-ecosystem-group: repository-version-updates
    cooldown:
      default-days: 0
